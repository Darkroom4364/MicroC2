storage:
  # Durable agent, task/result, payload, and listener-event state. Keep this
  # outside staticDir so operator history is never web-addressable.
  path: "data/microc2.db"

server:
  port: 8080
  httpsPort: 8443
  uploadDir: "uploads"
  staticDir: "static"
  tls:
    enabled: true
    certFile: "certs/server.crt"
    keyFile: "certs/server.key"
  redirect:
    enabled: true
    httpPort: 8080
  
communication:
  # Available protocols: http
  protocol: http
  
  # Protocol-specific settings
  http:
    heartbeatInterval: 60  # seconds
    
security:
  enableCORS: true
  agentTransport:
    # Plaintext HTTP agent listeners are rejected unless this isolated-lab
    # escape hatch is explicitly enabled.
    allowInsecureIsolatedLab: false
  # CORS origins for agent polling routes. Use ["*"] only as an explicit
  # escape hatch; empty list means no cross-origin access.
  corsOrigins: ["https://localhost:8443", "http://localhost:8080"]
  # Shared token protecting the operator API, file drop, and server terminal.
  # Empty means loopback-only operator access (safe lab default).
  # Can also be set via the MICROC2_OPERATOR_TOKEN environment variable.
  operatorToken: ""
  # Origins allowed to open operator WebSockets (log stream, terminal).
  # Same-host and loopback origins are always allowed.
  operatorAllowedOrigins: ["https://localhost:8443", "http://localhost:8080"]
  
logging:
  level: info
  file: "server.log"
